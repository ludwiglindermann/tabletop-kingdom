<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - TableTop Kingdom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <div class="logo-area">
      <span class="crown">♟</span>
      <h1>TableTop Kingdom</h1>
      <p class="tagline">Inicia sesión en tu cuenta</p>
    </div>
  </header>

  <nav class="breadcrumb">
    <a href="index.html">← Volver al inicio</a>
    <a href="pages/registro.html">Crear cuenta</a>
    <a href="recuperar.html">Recuperar contraseña</a>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="form-container">
          <h2 class="text-center mb-4">Iniciar Sesión</h2>

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="correo" class="form-control" placeholder="tucorreo@email.com"/>
            <small id="error-correo" class="text-danger"></small>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="Tu contraseña"/>
            <small id="error-password" class="text-danger"></small>
          </div>

          <div id="error-login" class="text-danger text-center mb-3"></div>

          <div class="d-flex gap-3 justify-content-center mt-4">
            <button onclick="iniciarSesion()" class="btn-registro">Ingresar</button>
            <button onclick="limpiarLogin()" class="btn-limpiar">Limpiar</button>
          </div>

          <div class="text-center mt-3">
            <a href="recuperar.html" style="color: var(--color-acento);">¿Olvidaste tu contraseña?</a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 TableTop Kingdom — Todos los derechos reservados</p>
  </footer>

  <script src="js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
