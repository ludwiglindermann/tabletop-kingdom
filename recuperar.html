<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Contraseña - TableTop Kingdom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <div class="logo-area">
      <span class="crown">♟</span>
      <h1>TableTop Kingdom</h1>
      <p class="tagline">Recupera tu contraseña</p>
    </div>
  </header>

  <nav class="breadcrumb">
    <a href="index.html">← Volver al inicio</a>
    <a href="login.html">Iniciar sesión</a>
    <a href="pages/registro.html">Crear cuenta</a>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="form-container">
          <h2 class="text-center mb-4">Recuperar Contraseña</h2>
          <p class="text-center mb-4" style="opacity: 0.7;">Ingresa tu correo y tu nueva contraseña</p>

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="correo" class="form-control" placeholder="tucorreo@email.com"/>
            <small id="error-correo" class="text-danger"></small>
          </div>

          <div class="mb-3">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" id="nuevaPassword" class="form-control" placeholder="Entre 6 y 18 caracteres"/>
            <small id="error-password" class="text-danger"></small>
          </div>

          <div class="mb-3">
            <label class="form-label">Repetir nueva contraseña</label>
            <input type="password" id="confirmarPassword" class="form-control" placeholder="Repite tu nueva contraseña"/>
            <small id="error-confirmar" class="text-danger"></small>
          </div>

          <div class="d-flex gap-3 justify-content-center mt-4">
            <button onclick="recuperarPassword()" class="btn-registro">Actualizar</button>
            <button onclick="limpiarRecuperar()" class="btn-limpiar">Limpiar</button>
          </div>

          <div id="mensaje-recuperar" class="mensaje-exito mt-3"></div>

        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 TableTop Kingdom — Todos los derechos reservados</p>
  </footer>

  <script src="js/recuperar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
